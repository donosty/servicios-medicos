name: CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-cd-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Testing Docker
    runs-on: ubuntu-latest

    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Preparar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validar pruebas del backend
        run: docker build --target test --tag servicios-medicos-backend:test ./backend

      - name: Validar pruebas del frontend
        run: docker build --target test --tag servicios-medicos-frontend:test ./frontend

      - name: Validar imagen de migraciones
        run: docker build --file deploy/migrations/Dockerfile --tag servicios-medicos-migrations:test .

  build-and-publish:
    name: Construir y publicar imagenes
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Preparar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Iniciar sesion en Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Construir y publicar backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          target: production
          push: true
          platforms: linux/amd64,linux/arm64
          provenance: false
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/servicios-medicos-backend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/servicios-medicos-backend:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.title=Servicios Médicos Backend
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Construir y publicar frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          target: production
          push: true
          platforms: linux/amd64,linux/arm64
          provenance: false
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/servicios-medicos-frontend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/servicios-medicos-frontend:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.title=Servicios Médicos Frontend
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

      - name: Construir y publicar migraciones
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./deploy/migrations/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          provenance: false
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/servicios-medicos-migrations:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/servicios-medicos-migrations:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.title=Servicios Médicos Migrations
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=migrations
          cache-to: type=gha,mode=max,scope=migrations

      - name: Configurar acceso SSH a OCI
        env:
          OCI_DEPLOY_SSH_KEY: ${{ secrets.OCI_DEPLOY_SSH_KEY }}
        run: |
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          printf '%s\n' "$OCI_DEPLOY_SSH_KEY" > "$HOME/.ssh/oci_deploy"
          chmod 600 "$HOME/.ssh/oci_deploy"

      - name: Desplegar en OCI Compute
        env:
          OCI_DEPLOY_HOST: ${{ secrets.OCI_DEPLOY_HOST }}
          OCI_DEPLOY_USER: ${{ secrets.OCI_DEPLOY_USER }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          CORS_ORIGINS: ${{ secrets.CORS_ORIGINS }}
          ADMIN_NAME: ${{ secrets.ADMIN_NAME }}
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
        run: |
          cat > "$RUNNER_TEMP/.env.production" <<EOF
          BACKEND_IMAGE=${DOCKERHUB_USERNAME}/servicios-medicos-backend:sha-${GITHUB_SHA}
          FRONTEND_IMAGE=${DOCKERHUB_USERNAME}/servicios-medicos-frontend:sha-${GITHUB_SHA}
          MIGRATIONS_IMAGE=${DOCKERHUB_USERNAME}/servicios-medicos-migrations:sha-${GITHUB_SHA}
          DATABASE_URL=${DATABASE_URL}
          DB_SSL=true
          CORS_ORIGINS=${CORS_ORIGINS}
          ADMIN_NAME=${ADMIN_NAME:-Administrador MEDICOM}
          ADMIN_EMAIL=${ADMIN_EMAIL}
          ADMIN_PASSWORD=${ADMIN_PASSWORD}
          EOF

          chmod 600 "$RUNNER_TEMP/.env.production"

          scp -i "$HOME/.ssh/oci_deploy" -o StrictHostKeyChecking=accept-new \
            deploy/docker-compose.prod.yml \
            "${OCI_DEPLOY_USER}@${OCI_DEPLOY_HOST}:~/docker-compose.prod.yml"
          scp -i "$HOME/.ssh/oci_deploy" -o StrictHostKeyChecking=accept-new \
            "$RUNNER_TEMP/.env.production" \
            "${OCI_DEPLOY_USER}@${OCI_DEPLOY_HOST}:~/.env.production"

          ssh -i "$HOME/.ssh/oci_deploy" -o StrictHostKeyChecking=accept-new \
            "${OCI_DEPLOY_USER}@${OCI_DEPLOY_HOST}" \
            "cd ~ && \
             mkdir -p /opt/servicios-medicos && \
             mv ~/docker-compose.prod.yml /opt/servicios-medicos/docker-compose.prod.yml && \
             mv ~/.env.production /opt/servicios-medicos/.env.production && \
             chmod 600 /opt/servicios-medicos/.env.production && \
             cd /opt/servicios-medicos && \
             if [ -n '${DOCKERHUB_TOKEN}' ]; then printf '%s' '${DOCKERHUB_TOKEN}' | docker login -u '${DOCKERHUB_USERNAME}' --password-stdin; fi && \
             docker compose --env-file .env.production -f docker-compose.prod.yml pull && \
             docker compose --env-file .env.production -f docker-compose.prod.yml run --rm migrations && \
             docker compose --env-file .env.production -f docker-compose.prod.yml up -d --remove-orphans backend frontend && \
             docker image prune -f"

      - name: Verificar imagen backend publicada
        run: docker buildx imagetools inspect ${{ secrets.DOCKERHUB_USERNAME }}/servicios-medicos-backend:sha-${{ github.sha }}

      - name: Verificar imagen frontend publicada
        run: docker buildx imagetools inspect ${{ secrets.DOCKERHUB_USERNAME }}/servicios-medicos-frontend:sha-${{ github.sha }}

      - name: Verificar imagen de migraciones publicada
        run: docker buildx imagetools inspect ${{ secrets.DOCKERHUB_USERNAME }}/servicios-medicos-migrations:sha-${{ github.sha }}