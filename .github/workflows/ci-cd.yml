name: CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-cd-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Testing Docker
    runs-on: ubuntu-latest

    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Preparar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validar pruebas del backend
        run: docker build --target test --tag servicios-medicos-backend:test ./backend

      - name: Validar pruebas del frontend
        run: docker build --target test --tag servicios-medicos-frontend:test ./frontend

      - name: Validar imagen de migraciones
        run: docker build --file deploy/migrations/Dockerfile --tag servicios-medicos-migrations:test .

  build-and-publish:
    name: Construir y publicar imagenes
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Preparar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Iniciar sesion en Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Construir y publicar backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          target: production
          push: true
          platforms: linux/amd64
          provenance: false
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/servicios-medicos-backend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/servicios-medicos-backend:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.title=Servicios Médicos Backend
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Construir y publicar frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          target: production
          push: true
          platforms: linux/amd64
          provenance: false
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/servicios-medicos-frontend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/servicios-medicos-frontend:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.title=Servicios Médicos Frontend
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

      - name: Construir y publicar migraciones
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./deploy/migrations/Dockerfile
          push: true
          platforms: linux/amd64
          provenance: false
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/servicios-medicos-migrations:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/servicios-medicos-migrations:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.title=Servicios Médicos Migrations
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=migrations
          cache-to: type=gha,mode=max,scope=migrations

      - name: Autenticar con Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SERVICE_ACCOUNT_KEY }}

      - name: Configurar Google Cloud CLI
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}

      - name: Preparar configuracion de GCP
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_NAME: ${{ secrets.DB_NAME }}
          CORS_ORIGINS: ${{ secrets.CORS_ORIGINS }}
          ADMIN_NAME: ${{ secrets.ADMIN_NAME }}
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          PASSWORD_RESET_SECRET: ${{ secrets.PASSWORD_RESET_SECRET }}
          APP_PUBLIC_URL: ${{ secrets.APP_PUBLIC_URL }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_SECURE: ${{ secrets.SMTP_SECURE }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from urllib.parse import quote

          db_user = os.environ["DB_USER"]
          db_password = os.environ["DB_PASSWORD"]
          db_name = os.environ["DB_NAME"]
          sha = os.environ["GITHUB_SHA"]
          dockerhub = os.environ["DOCKERHUB_USERNAME"]
          values = {
              "BACKEND_IMAGE": f"{dockerhub}/servicios-medicos-backend:sha-{sha}",
              "FRONTEND_IMAGE": f"{dockerhub}/servicios-medicos-frontend:sha-{sha}",
              "MIGRATIONS_IMAGE": f"{dockerhub}/servicios-medicos-migrations:sha-{sha}",
              "DB_USER": db_user,
              "DB_PASSWORD": db_password,
              "DB_NAME": db_name,
              "DATABASE_URL": (
                  f"postgresql://{quote(db_user, safe='')}:{quote(db_password, safe='')}"
                  f"@db:5432/{quote(db_name, safe='')}"
              ),
              "CORS_ORIGINS": os.environ["CORS_ORIGINS"],
              "ADMIN_NAME": os.environ.get("ADMIN_NAME") or "Administrador MEDICOM",
              "ADMIN_EMAIL": os.environ["ADMIN_EMAIL"],
              "ADMIN_PASSWORD": os.environ["ADMIN_PASSWORD"],
              "PASSWORD_RESET_SECRET": os.environ["PASSWORD_RESET_SECRET"],
              "APP_PUBLIC_URL": os.environ["APP_PUBLIC_URL"],
              "SMTP_HOST": os.environ.get("SMTP_HOST") or "smtp.gmail.com",
              "SMTP_PORT": os.environ.get("SMTP_PORT") or "465",
              "SMTP_SECURE": os.environ.get("SMTP_SECURE") or "true",
              "SMTP_USER": os.environ["SMTP_USER"],
              "SMTP_PASSWORD": os.environ["SMTP_PASSWORD"],
              "SMTP_FROM": os.environ.get("SMTP_FROM") or os.environ["SMTP_USER"],
              "DOCKERHUB_USERNAME": dockerhub,
              "DOCKERHUB_TOKEN": os.environ["DOCKERHUB_TOKEN"],
          }
          with open(os.environ["RUNNER_TEMP"] + "/.env.production", "w", encoding="utf-8") as env_file:
              for key, value in values.items():
                  env_file.write(f"{key}={json.dumps(value)}\n")
          PY
          chmod 600 "$RUNNER_TEMP/.env.production"

      - name: Desplegar en Compute Engine
        env:
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          GCP_ZONE: ${{ secrets.GCP_ZONE }}
          GCP_VM_NAME: ${{ secrets.GCP_VM_NAME }}
        run: |
          gcloud compute scp \
            deploy/docker-compose.prod.yml \
            "$GCP_VM_NAME:/tmp/docker-compose.prod.yml" \
            --project="$GCP_PROJECT_ID" \
            --zone="$GCP_ZONE" \
            --tunnel-through-iap

          gcloud compute scp \
            "$RUNNER_TEMP/.env.production" \
            "$GCP_VM_NAME:/tmp/.env.production" \
            --project="$GCP_PROJECT_ID" \
            --zone="$GCP_ZONE" \
            --tunnel-through-iap

          gcloud compute scp \
            deploy/gcp/deploy.sh \
            "$GCP_VM_NAME:/tmp/deploy.sh" \
            --project="$GCP_PROJECT_ID" \
            --zone="$GCP_ZONE" \
            --tunnel-through-iap

          gcloud compute ssh "$GCP_VM_NAME" \
            --project="$GCP_PROJECT_ID" \
            --zone="$GCP_ZONE" \
            --tunnel-through-iap \
            --command="sudo install -d -m 0750 /opt/servicios-medicos && sudo chmod 0755 /tmp/deploy.sh && sudo /tmp/deploy.sh"

      - name: Verificar imagen backend publicada
        run: docker buildx imagetools inspect ${{ secrets.DOCKERHUB_USERNAME }}/servicios-medicos-backend:sha-${{ github.sha }}

      - name: Verificar imagen frontend publicada
        run: docker buildx imagetools inspect ${{ secrets.DOCKERHUB_USERNAME }}/servicios-medicos-frontend:sha-${{ github.sha }}

      - name: Verificar imagen de migraciones publicada
        run: docker buildx imagetools inspect ${{ secrets.DOCKERHUB_USERNAME }}/servicios-medicos-migrations:sha-${{ github.sha }}