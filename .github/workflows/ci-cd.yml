name: CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-cd-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Testing Docker
    runs-on: ubuntu-latest

    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Preparar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validar pruebas del backend
        run: docker build --target test --tag servicios-medicos-backend:test ./backend

      - name: Validar pruebas del frontend
        run: docker build --target test --tag servicios-medicos-frontend:test ./frontend

      - name: Validar imagen de migraciones
        run: docker build --file deploy/migrations/Dockerfile --tag servicios-medicos-migrations:test .

  build-and-publish:
    name: Construir y publicar imagenes
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Preparar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Iniciar sesion en Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Construir y publicar backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          target: production
          push: true
          provenance: false
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/servicios-medicos-backend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/servicios-medicos-backend:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.title=Servicios Médicos Backend
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Construir y publicar frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          target: production
          push: true
          provenance: false
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/servicios-medicos-frontend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/servicios-medicos-frontend:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.title=Servicios Médicos Frontend
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

      - name: Construir y publicar migraciones
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./deploy/migrations/Dockerfile
          push: true
          provenance: false
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/servicios-medicos-migrations:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/servicios-medicos-migrations:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.title=Servicios Médicos Migrations
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=migrations
          cache-to: type=gha,mode=max,scope=migrations

      - name: Generar especificacion con imagenes del commit
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          sed \
            -e "s|registry: donosty|registry: ${DOCKERHUB_USERNAME}|g" \
            -e "s|tag: latest|tag: sha-${GITHUB_SHA}|g" \
            deploy/app.yaml > /tmp/servicios-medicos-app.yaml

      - name: Instalar DigitalOcean CLI
        uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}

      - name: Desplegar especificacion en App Platform
        run: |
          doctl apps update "${{ secrets.DIGITALOCEAN_APP_ID }}" \
            --spec /tmp/servicios-medicos-app.yaml \
            --wait

      - name: Verificar imagen backend publicada
        run: docker buildx imagetools inspect ${{ secrets.DOCKERHUB_USERNAME }}/servicios-medicos-backend:latest

      - name: Verificar imagen frontend publicada
        run: docker buildx imagetools inspect ${{ secrets.DOCKERHUB_USERNAME }}/servicios-medicos-frontend:latest

      - name: Verificar imagen de migraciones publicada
        run: docker buildx imagetools inspect ${{ secrets.DOCKERHUB_USERNAME }}/servicios-medicos-migrations:latest