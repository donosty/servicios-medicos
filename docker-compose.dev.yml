services:
  backend:
    build:
      context: ./backend
      target: development
    container_name: node_backend_dev
    command: sh -c "npm ci && exec npm run dev"
    volumes:
      - ./backend:/app
      - backend_node_modules:/app/node_modules
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - PORT=3000
      - DB_HOST=db
      - DB_PORT=5432
      - DB_USER=${DB_USER:?DB_USER is required}
      - DB_PASSWORD=${DB_PASSWORD:?DB_PASSWORD is required}
      - DB_NAME=${DB_NAME:?DB_NAME is required}
      - PASSWORD_RESET_SECRET=${PASSWORD_RESET_SECRET:-desarrollo-restablecimiento-local}
      - APP_PUBLIC_URL=${APP_PUBLIC_URL:-http://localhost:4200}
      - SMTP_HOST=${SMTP_HOST:-smtp.gmail.com}
      - SMTP_PORT=${SMTP_PORT:-465}
      - SMTP_SECURE=${SMTP_SECURE:-true}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - SMTP_FROM=${SMTP_FROM:-MEDICOM <no-reply@medicom.com>}
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      target: development
    container_name: angular_frontend_dev
    working_dir: /app
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    command: npm run dev
    ports: !override
      - "4200:4200"
    depends_on:
      - backend
    environment:
      - WATCHPACK_POLLING=true

volumes:
  backend_node_modules:
  frontend_node_modules:
