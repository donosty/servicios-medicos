name: servicios-medicos
region: nyc

databases:
  - name: database
    engine: PG
    production: true

jobs:
  - name: database-migration
    kind: PRE_DEPLOY
    image:
      registry_type: DOCKER_HUB
      registry: donosty
      repository: servicios-medicos-migrations
      tag: latest
    instance_size_slug: apps-s-1vcpu-0.5gb
    instance_count: 1
    envs:
      - key: DATABASE_URL
        scope: RUN_TIME
        value: ${database.DATABASE_URL}
        type: SECRET
      - key: ADMIN_NAME
        scope: RUN_TIME
        value: Administrador MEDICOM
      - key: ADMIN_EMAIL
        scope: RUN_TIME
        type: SECRET
      - key: ADMIN_PASSWORD
        scope: RUN_TIME
        type: SECRET

services:
  - name: backend
    image:
      registry_type: DOCKER_HUB
      registry: donosty
      repository: servicios-medicos-backend
      tag: latest
    instance_size_slug: apps-s-1vcpu-0.5gb
    instance_count: 1
    http_port: 3000
    routes:
      - path: /api
        preserve_path_prefix: true
    health_check:
      http_path: /health
    envs:
      - key: NODE_ENV
        scope: RUN_TIME
        value: production
      - key: PORT
        scope: RUN_TIME
        value: "3000"
      - key: DATABASE_URL
        scope: RUN_TIME
        value: ${database.DATABASE_URL}
        type: SECRET
      - key: DB_SSL
        scope: RUN_TIME
        value: "true"
      - key: CORS_ORIGINS
        scope: RUN_TIME
        type: SECRET

  - name: frontend
    image:
      registry_type: DOCKER_HUB
      registry: donosty
      repository: servicios-medicos-frontend
      tag: latest
    instance_size_slug: apps-s-1vcpu-0.5gb
    instance_count: 1
    http_port: 80
    routes:
      - path: /
    health_check:
      http_path: /health
