services:
  backend:
    image: ${BACKEND_IMAGE}
    restart: always
    environment:
      NODE_ENV: production
      PORT: "3000"
      DATABASE_URL: ${DATABASE_URL}
      DB_SSL: ${DB_SSL:-true}
      CORS_ORIGINS: ${CORS_ORIGINS}
    ports:
      - "3000:3000"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    image: ${FRONTEND_IMAGE}
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend

  migrations:
    image: ${MIGRATIONS_IMAGE}
    profiles:
      - migrations
    environment:
      DATABASE_URL: ${DATABASE_URL}
      PGSSLMODE: require
      ADMIN_NAME: ${ADMIN_NAME:-Administrador MEDICOM}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
