<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Restablecer contraseña | MEDICOM</title>
    <link rel="icon" href="/assets/medicom-icon.webp" type="image/webp" />
    <link rel="stylesheet" href="/bootstrap/css/bootstrap.min.css" />
    <link rel="stylesheet" href="/styles.css" />
    <link rel="stylesheet" href="/features/auth/auth.css" />
  </head>
  <body class="auth-page">
    <main class="auth-shell">
      <section class="auth-card" aria-labelledby="forgot-titulo">
        <img class="auth-brand" src="/assets/medicom.webp" alt="MEDICOM" />
        <h1 id="forgot-titulo">Restablecer contraseña</h1>
        <p class="auth-intro">Ingresa el correo asociado a tu cuenta.</p>
        <form id="forgot-password-form">
          <div class="auth-field">
            <label for="correo">Correo electrónico</label>
            <input
              id="correo"
              name="email"
              type="email"
              autocomplete="email"
              required
            />
          </div>
          <button class="auth-submit" type="submit">Enviar</button>
          <p
            id="forgot-password-message"
            class="auth-message"
            role="status"
          ></p>
        </form>
        <div class="auth-links">
          <a href="/login.html">Volver al inicio de sesión</a>
        </div>
      </section>
    </main>
    <script src="/features/auth/forgot-password.js"></script>
  </body>
</html>
