<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Nueva contraseña | MEDICOM</title>
    <link rel="icon" href="/assets/medicom-icon.webp" type="image/webp" />
    <link rel="stylesheet" href="/bootstrap/css/bootstrap.min.css" />
    <link rel="stylesheet" href="/styles.css" />
    <link rel="stylesheet" href="/features/auth/auth.css" />
  </head>
  <body class="auth-page">
    <main class="auth-shell">
      <section class="auth-card" aria-labelledby="reset-titulo">
        <img class="auth-brand" src="/assets/medicom.webp" alt="MEDICOM" />
        <h1 id="reset-titulo">Nueva contraseña</h1>
        <form id="reset-password-form" hidden>
          <div class="auth-field">
            <label for="nueva-contrasena">Nueva contraseña</label>
            <input id="nueva-contrasena" name="password" type="password" autocomplete="new-password" minlength="8" maxlength="72" required />
          </div>
          <div class="auth-field">
            <label for="confirmar-contrasena">Confirmar contraseña</label>
            <input id="confirmar-contrasena" name="passwordConfirmation" type="password" autocomplete="new-password" minlength="8" maxlength="72" required />
          </div>
          <button class="auth-submit" type="submit">Guardar contraseña</button>
        </form>
        <p id="reset-password-message" class="auth-message" role="alert"></p>
        <div class="auth-links">
          <a href="/login.html">Volver al inicio de sesión</a>
        </div>
      </section>
    </main>
    <script src="/features/auth/reset-password.js"></script>
  </body>
</html>
