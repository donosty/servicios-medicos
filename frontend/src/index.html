<!doctype html>
<html lang="es" ng-app="serviciosMedicosApp">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#003B71" />
    <meta
      name="description"
      content="Conoce MEDICOM y explora nuestras especialidades médicas para toda la familia."
    />
    <title>Inicio | MEDICOM</title>
    <link rel="icon" href="/assets/medicom-icon.webp" type="image/webp" />
    <link
      rel="preload"
      href="/assets/fonts/plus-jakarta-sans.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link rel="stylesheet" href="/bootstrap/css/bootstrap.min.css" />
    <link rel="stylesheet" href="/styles.css" />
    <link rel="stylesheet" href="/features/specialties/care.css" />
    <link rel="stylesheet" href="/features/booking/booking.css" />
    <link rel="stylesheet" href="/features/reviews/reviews.css" />
  </head>
  <body class="medicom-home" id="inicio" ng-controller="HomeController as home">
    <a class="skip-link" href="#contenido">Saltar al contenido</a>
    <header class="site-header">
      <div class="home-wrap header-inner">
        <a
          class="brand-link"
          href="#inicio"
          aria-label="MEDICOM, inicio"
          ng-click="home.returnHome()"
        >
          <img
            src="/assets/medicom.webp"
            alt="MEDICOM"
            width="560"
            height="208"
          />
        </a>
        <nav
          id="menu-principal"
          class="main-nav"
          aria-label="Navegación principal"
          ng-class="{'is-open': home.menuOpen}"
          ng-keydown="home.handleMenuKey($event)"
        >
          <a
            href="#inicio"
            ng-attr-aria-current="{{home.bookingOpen ? undefined : 'page'}}"
            ng-click="home.returnHome()"
          >
            Inicio
          </a>
          <a href="#especialidades" ng-click="home.returnHome()"
            >Especialidades</a
          >
          <button
            type="button"
            ng-click="home.showNotice('El directorio de médicos estará disponible próximamente.', $event)"
          >
            Médicos
          </button>
          <a href="#contacto" ng-click="home.closeMenu()">Contacto</a>
        </nav>
        <div class="header-actions">
          <button
            type="button"
            class="book-button"
            ng-click="home.openBooking('', $event)"
          >
            Agendar cita
          </button>
          <button
            type="button"
            id="menu-toggle"
            class="menu-toggle"
            aria-label="Menú principal"
            aria-controls="menu-principal"
            ng-attr-aria-expanded="{{home.menuOpen}}"
            ng-click="home.toggleMenu()"
          >
            <svg aria-hidden="true" width="24" height="24">
              <use href="/assets/ui.svg#menu"></use>
            </svg>
          </button>
        </div>
      </div>
    </header>
    <main id="contenido" tabindex="-1">
      <section class="hero" aria-labelledby="hero-title" ng-if="!home.bookingOpen">
        <img
          class="hero-team"
          src="/assets/equipo-medico.webp"
          alt="Tres integrantes del equipo médico con bata y estetoscopio"
          width="841"
          height="683"
          fetchpriority="high"
        />
        <div class="home-wrap hero-inner">
          <div class="hero-copy">
            <h1 id="hero-title">
              Cuidamos de tu salud con
              <span>especialistas de primer nivel</span>
            </h1>
            <p>
              Nuestra especialidad eres tú. Contamos con médicos especialistas
              para atender las necesidades médicas de toda tu familia.
            </p>
            <form
              class="specialty-search"
              role="search"
              aria-label="Buscar especialidades"
              ng-submit="home.search()"
            >
              <label for="busqueda" class="visually-hidden"
                >Busca una especialidad</label
              >
              <input
                type="search"
                id="busqueda"
                ng-model="home.searchText"
                placeholder="Busca una especialidad"
                autocomplete="off"
              />
              <button type="submit" aria-label="Buscar especialidad">
                <svg width="24" height="24" aria-hidden="true">
                  <use href="/assets/ui.svg#search"></use>
                </svg>
              </button>
            </form>
          </div>
        </div>
      </section>
      <specialty-list
        id="especialidades"
        tabindex="-1"
        ng-if="!home.bookingOpen"
        query="home.query"
        on-book="home.openBooking(name, $event)"
        on-clear="home.clearSearch()"
      ></specialty-list>
      <care-benefits ng-if="!home.bookingOpen"></care-benefits>
      <patient-reviews ng-if="!home.bookingOpen"></patient-reviews>
      <appointment-booking
        ng-if="home.bookingOpen"
        specialty-name="home.bookingSpecialty"
        on-close="home.closeBooking()"
      ></appointment-booking>
    </main>
    <home-footer
      on-home="home.returnHome()"
      on-notice="home.showNotice(message, $event)"
      on-select="home.filterBy(name)"
    ></home-footer>
    <dialog
      id="notice"
      class="notice-dialog"
      aria-labelledby="notice-title"
      aria-describedby="notice-text"
    >
      <h2 id="notice-title">Próximamente</h2>
      <p id="notice-text" ng-bind="home.notice"></p>
      <button
        type="button"
        class="book-button"
        ng-click="home.closeNotice()"
        autofocus
      >
        Entendido
      </button>
    </dialog>
    <script src="/Lib/angular.min.js"></script>
    <script src="/app/app.module.js"></script>
    <script src="/common/services/api.service.js"></script>
    <script src="/common/utils/string.utils.js"></script>
    <script src="/common/utils/date.utils.js"></script>
    <script src="/app/controllers/home.controller.js"></script>
    <script src="/app/components/footer.component.js"></script>
    <script src="/features/specialties/specialties.service.js"></script>
    <script src="/features/specialties/care-carousel.directive.js"></script>
    <script src="/features/specialties/specialty-list.component.js"></script>
    <script src="/features/booking/booking.component.js"></script>
    <script src="/features/care/care-benefits.component.js"></script>
    <script src="/features/reviews/reviews.component.js"></script>
  </body>
</html>
