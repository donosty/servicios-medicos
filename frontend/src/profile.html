<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Mi perfil | MEDICOM</title>
    <link rel="icon" href="/assets/medicom-icon.webp" type="image/webp" />
    <link rel="stylesheet" href="/bootstrap/css/bootstrap.min.css" />
    <link rel="stylesheet" href="/styles.css" />
    <link rel="stylesheet" href="/features/auth/auth.css" />
    <link rel="stylesheet" href="/features/profile/profile.css" />
  </head>
  <body class="profile-page">
    <header class="profile-header">
      <div class="home-wrap profile-header-inner">
        <a href="/index.html" aria-label="MEDICOM, volver al inicio">
          <img src="/assets/medicom.webp" alt="MEDICOM" />
        </a>
        <nav aria-label="Opciones de perfil">
          <a class="profile-home-link" href="/index.html">Inicio</a>
          <button id="profile-logout" type="button">Cerrar sesión</button>
        </nav>
      </div>
    </header>
    <main class="home-wrap profile-layout">
      <aside class="profile-sidebar" aria-label="Datos principales">
        <div class="profile-avatar" id="profile-initials" aria-hidden="true">M</div>
        <h1 id="profile-name">Mi perfil</h1>
        <p id="profile-email">correo@ejemplo.com</p>
      </aside>

      <div class="profile-content">
        <section class="profile-card" aria-labelledby="datos-titulo">
          <div class="profile-section-heading">
            <div>
              <p>Información personal</p>
              <h2 id="datos-titulo">Mis datos</h2>
            </div>
          </div>
          <form id="profile-form" novalidate>
            <div class="profile-fields">
              <label>
                Nombre completo
                <input id="fullName" name="fullName" type="text" minlength="3" maxlength="120" required />
              </label>
              <label>
                Teléfono
                <input id="phone" name="phone" type="tel" minlength="7" maxlength="25" required />
              </label>
              <label class="profile-field-wide">
                Correo electrónico
                <input id="email" name="email" type="email" maxlength="254" required />
              </label>
            </div>
            <p id="profile-message" class="profile-message" role="status"></p>
            <button class="profile-save" type="submit">Guardar cambios</button>
          </form>
        </section>

        <section class="profile-card" aria-labelledby="citas-titulo">
          <div class="profile-section-heading">
            <div>
              <p>Historial médico</p>
              <h2 id="citas-titulo">Mis citas</h2>
            </div>
          </div>
          <div class="appointment-tabs" role="tablist" aria-label="Tipo de citas">
            <button id="scheduled-tab" type="button" role="tab" aria-selected="true" aria-controls="scheduled-panel">
              Agendadas
            </button>
            <button id="completed-tab" type="button" role="tab" aria-selected="false" aria-controls="completed-panel">
              Completadas
            </button>
          </div>
          <div id="scheduled-panel" role="tabpanel" aria-labelledby="scheduled-tab"></div>
          <div id="completed-panel" role="tabpanel" aria-labelledby="completed-tab" hidden></div>
        </section>
      </div>
    </main>
    <script src="/features/profile/profile.js"></script>
  </body>
</html>
