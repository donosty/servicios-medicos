<section id="servicios" class="featured-services" aria-labelledby="titulo-servicios">
  <div class="home-wrap">
    <div class="featured-services-heading">
      <p>Atención integral</p>
      <h2 id="titulo-servicios">Servicios destacados</h2>
    </div>
    <div class="featured-services-grid" ng-if="$ctrl.catalog.featured.length">
      <article
        class="featured-service-card"
        ng-repeat="service in $ctrl.catalog.featured track by service.id"
      >
        <span class="featured-service-mark" aria-hidden="true">
          <svg width="28" height="28">
            <use href="/assets/ui.svg#plus"></use>
          </svg>
        </span>
        <h3>{{service.name}}</h3>
        <p>{{service.description}}</p>
        <p class="featured-service-price" ng-if="service.price != null">
          {{service.price | currency:'$'}} MXN
        </p>
      </article>
    </div>
  </div>
</section>
