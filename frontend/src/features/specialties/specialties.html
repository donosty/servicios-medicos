<section
  class="care-specialties"
  aria-labelledby="titulo-especialidades"
>
  <div class="home-wrap">
    <h2 id="titulo-especialidades" class="care-title" tabindex="-1">
      Especialidades Médicas
    </h2>
    <p class="care-intro">
      Encuentra la atención que necesitas para ti y tu familia.
    </p>
    <div class="care-specialty-carousel" ng-if="$ctrl.specialties.length">
      <button
        type="button"
        class="care-specialty-arrow care-specialty-prev"
        aria-label="Especialidades anteriores"
        ng-show="$ctrl.canMoveLeft"
        ng-click="$ctrl.move(-1)"
      >
        <span aria-hidden="true">‹</span>
      </button>
      <div
        class="care-specialty-grid"
        care-carousel-scroll="$ctrl.updateCarouselState()"
      >
      <article
        class="care-specialty-card"
        ng-repeat="item in $ctrl.specialties track by item.id"
      >
        <img
          ng-src="{{item.icon || '/assets/icons/' + item.id + '.webp'}}"
          width="110"
          height="110"
          alt=""
        />
        <h3>{{item.name}}</h3>
        <p>{{item.description}}</p>
        <button
          type="button"
          class="care-book"
          ng-attr-aria-label="Agendar cita en {{item.name}}"
          ng-click="$ctrl.requestBooking(item, $event)"
        >
          Agendar cita
        </button>
      </article>
      </div>
      <button
        type="button"
        class="care-specialty-arrow care-specialty-next"
        aria-label="Especialidades siguientes"
        ng-show="$ctrl.canMoveRight"
        ng-click="$ctrl.move(1)"
      >
        <span aria-hidden="true">›</span>
      </button>
    </div>
    <div
      class="care-specialty-dots"
      ng-if="$ctrl.canMoveLeft || $ctrl.canMoveRight"
    >
      <button
        type="button"
        ng-repeat="item in $ctrl.specialties track by item.id"
        ng-class="{'is-active': $ctrl.currentPage === $index}"
        ng-click="$ctrl.goTo($index)"
        ng-attr-aria-label="Ir a {{item.name}}"
        ng-attr-aria-current="{{$ctrl.currentPage === $index ? 'true' : undefined}}"
      ></button>
    </div>
    <a class="care-book care-book-link" href="#especialidades" ng-click="$ctrl.onCatalog()">
      Ver todas las especialidades
    </a>
  </div>
</section>
